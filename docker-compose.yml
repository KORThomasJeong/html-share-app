services:
  app:
    container_name: html-share-app
    build: .
    ports:
      - "${APP_PORT:-3001}:3000"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - NODE_ENV=production
    volumes:
      - ./collections:/app/collections
    depends_on:
      - db
    networks:
      - npm
    restart: always
  
  db:
    container_name: html-share-db
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - npm
    restart: always

volumes:
  postgres_data:


networks:
  npm:
    external: true
    name: npm
    driver: bridge